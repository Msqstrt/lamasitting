<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elliot-sitting</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Elliot-sitting">
<meta name="theme-color" content="#FBF8F3">
<style>
  :root{
    --encre:#1B2A3A; --papier:#FBF8F3; --trait:#DCD3C4;
    --creance:#2E6B52; --dette:#9E3B2F; --doux:#6D7C89;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papier);color:var(--encre);
    font-family:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 64px}
  h1{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:600;
     font-size:1.35rem;letter-spacing:-.01em;margin:0 0 2px}
  .sub{color:var(--doux);font-size:.82rem;margin:0 0 22px;line-height:1.5}

  .solde{border-top:2px solid var(--encre);border-bottom:1px solid var(--trait);
    padding:18px 0 20px;margin-bottom:24px}
  .solde .lbl{font-size:.8rem;color:var(--doux);margin-bottom:6px}
  .solde .val{font-family:"Iowan Old Style",Palatino,Georgia,serif;
    font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
  .solde .exp{font-size:.85rem;margin-top:8px;max-width:38ch;line-height:1.45}
  .pos{color:var(--creance)} .neg{color:var(--dette)}

  .actions{display:flex;gap:10px}
  button{font:inherit;cursor:pointer;border-radius:10px;padding:13px 14px;
    border:1px solid var(--encre);background:transparent;color:var(--encre);flex:1}
  button.primaire{background:var(--encre);color:var(--papier)}
  button:disabled{opacity:.45;cursor:default}
  button:focus-visible{outline:2px solid var(--creance);outline-offset:2px}

  form{border:1px solid var(--trait);border-radius:12px;padding:16px;margin:14px 0 4px;background:#fff}
  form[hidden]{display:none}
  label{display:block;font-size:.8rem;color:var(--doux);margin:10px 0 4px;line-height:1.4}
  input,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--trait);
    border-radius:9px;background:var(--papier);color:var(--encre)}
  textarea{font-family:ui-monospace,Menlo,monospace;font-size:.82rem;resize:vertical}
  .duo{display:flex;gap:10px} .duo>div{flex:1}
  .hm{display:flex;gap:6px}
  .hm select{flex:1;font:inherit;padding:11px 8px;border:1px solid var(--trait);
    border-radius:9px;background:var(--papier);color:var(--encre)}
  .estim{font-size:.85rem;margin-top:14px;color:var(--doux);min-height:1.2em}
  .estim b{color:var(--encre);font-variant-numeric:tabular-nums}
  .btns{display:flex;gap:10px;margin-top:14px}
  .err{color:var(--dette);font-size:.82rem;margin-top:10px;line-height:1.45}

  h2{font-size:.8rem;font-weight:600;color:var(--doux);margin:32px 0 0;
     padding-bottom:8px;border-bottom:1px solid var(--trait)}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
     padding:13px 0;border-bottom:1px solid var(--trait)}
  .quoi{font-size:.94rem} .quand{font-size:.78rem;color:var(--doux);margin-top:3px}
  .montant{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .sup{background:none;border:0;color:var(--doux);font-size:.75rem;padding:4px 0 0;
    text-decoration:underline;flex:0}
  .vide{color:var(--doux);font-size:.88rem;padding:18px 0;line-height:1.5}
  .maint{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .maint button{font-size:.85rem;padding:11px 12px;border-color:var(--trait);color:var(--doux)}
  .maint button.danger{border-color:var(--dette);color:var(--dette)}
  .etat{font-size:.78rem;color:var(--doux);margin-top:26px;text-align:center;line-height:1.5}
  #app[hidden],#connexion[hidden]{display:none}
</style>
</head>
<body>

<div class="wrap">

  <!-- ======= À REMPLIR : vos deux valeurs Supabase ======= -->
  <script>
    const SUPABASE_URL = 'https://nlbyuowgzuphkkdmzkpz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_OKewTelduU2WxbskMhdplA_YdYptKRn';
  </script>
  <!-- ==================================================== -->

  <h1>Elliot-sitting</h1>
  <p class="sub">2 premières heures à 15 €/h, puis 10 €/h, au prorata des minutes.</p>

  <section id="connexion" hidden>
    <form onsubmit="return false">
      <label for="mail">Adresse email</label>
      <input type="email" id="mail" autocomplete="email" placeholder="vous@exemple.com">
      <label for="mdp">Mot de passe. Laissez vide pour recevoir un lien de connexion par email à la place.</label>
      <input type="password" id="mdp" autocomplete="current-password">
      <div class="err" id="cErr"></div>
      <div class="btns">
        <button type="button" class="primaire" id="bMdp">Se connecter</button>
        <button type="button" id="bLien">Recevoir un lien</button>
      </div>
    </form>
  </section>

  <section id="app" hidden>
    <div class="solde">
      <div class="lbl">Solde</div>
      <div class="val" id="val">—</div>
      <div class="exp" id="exp">Chargement…</div>
    </div>

    <div class="actions">
      <button class="primaire" id="bAvance">Noter une avance</button>
      <button id="bGarde">Noter une garde</button>
    </div>

    <form id="fAvance" hidden>
      <label for="aDate">Date du versement</label>
      <input type="date" id="aDate">
      <label for="aMontant">Montant versé (€)</label>
      <input type="number" id="aMontant" inputmode="decimal" step="0.01" min="0" placeholder="200">
      <div class="err" id="aErr"></div>
      <div class="btns">
        <button type="button" class="primaire" id="aOk">Enregistrer l'avance</button>
        <button type="button" data-close="fAvance">Annuler</button>
      </div>
    </form>

    <form id="fGarde" hidden>
      <label for="gDate">Date de la garde, celle du soir où elle commence</label>
      <input type="date" id="gDate">
      <div class="duo">
        <div>
          <label>Début</label>
          <div class="hm"><select id="gDebH"></select><select id="gDebM"></select></div>
        </div>
        <div>
          <label>Fin</label>
          <div class="hm"><select id="gFinH"></select><select id="gFinM"></select></div>
        </div>
      </div>
      <div class="estim" id="gEstim"></div>
      <div class="err" id="gErr"></div>
      <div class="btns">
        <button type="button" class="primaire" id="gOk">Enregistrer la garde</button>
        <button type="button" data-close="fGarde">Annuler</button>
      </div>
    </form>

    <h2>Historique</h2>
    <ul id="liste"></ul>

    <div class="maint">
      <button id="bRefresh">Actualiser</button>
      <button id="bExport">Exporter les données</button>
      <button id="bSortir">Se déconnecter</button>
    </div>
    <div class="err" id="rErr"></div>

    <form id="fExport" hidden>
      <label for="csv">Copiez ce texte et collez-le dans un mail, une note ou un tableur.</label>
      <textarea id="csv" readonly rows="8"></textarea>
      <div class="btns">
        <button type="button" class="primaire" id="bCopier">Copier</button>
        <button type="button" data-close="fExport">Fermer</button>
      </div>
    </form>
  </section>

  <div class="etat" id="etat"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
let journal = [];

/* ---------- calculs ---------- */
const eur = n => n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';
const cout = h => Math.min(h,2)*15 + Math.max(0,h-2)*10;

function duree(deb,fin){
  const [h1,m1]=deb.split(':').map(Number), [h2,m2]=fin.split(':').map(Number);
  let min=(h2*60+m2)-(h1*60+m1);
  if(min<=0) min+=24*60;
  return Math.round(min/5)*5/60;
}
const dateFr = iso => new Date(iso+'T12:00:00')
  .toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
function heuresFr(h){ const H=Math.floor(h), M=Math.round((h-H)*60);
  return M? `${H} h ${String(M).padStart(2,'0')}` : `${H} h`; }
const aujourdhui = () => new Date().toISOString().slice(0,10);
const solde = () => journal.reduce((s,e)=> s + (e.type==='avance'? Number(e.montant) : -Number(e.montant)), 0);

/* ---------- authentification ---------- */
$('bLien').onclick = async () => {
  const mail = $('mail').value.trim();
  if(!mail.includes('@')){ $('cErr').textContent = 'Saisissez une adresse email valide.'; return; }
  $('cErr').textContent=''; $('bLien').disabled=true; $('bLien').textContent='Envoi…';
  const { error } = await sb.auth.signInWithOtp({
    email: mail,
    options: { emailRedirectTo: window.location.href.split('#')[0] }
  });
  $('bLien').disabled=false; $('bLien').textContent='Recevoir le lien';
  if(error){ $('cErr').textContent = "Envoi impossible : " + error.message; return; }
  $('etat').textContent = "Lien envoyé. Ouvrez-le depuis ce téléphone, il expire au bout de quelques minutes.";
};

$('bMdp').onclick = async () => {
  const mail = $('mail').value.trim();
  const mdp = $('mdp').value;
  if(!mail.includes('@')){ $('cErr').textContent = 'Saisissez une adresse email valide.'; return; }
  if(!mdp){ $('cErr').textContent = "Saisissez votre mot de passe, ou utilisez le bouton Recevoir un lien."; return; }
  $('cErr').textContent=''; $('bMdp').disabled=true; $('bMdp').textContent='Connexion…';
  const { error } = await sb.auth.signInWithPassword({ email: mail, password: mdp });
  $('bMdp').disabled=false; $('bMdp').textContent='Se connecter';
  if(error){ $('cErr').textContent = "Connexion impossible : " + error.message; return; }
  $('mdp').value='';
};

$('bSortir').onclick = async () => { await sb.auth.signOut(); location.reload(); };

sb.auth.onAuthStateChange((_e, session) => afficher(session));
const { data:{ session } } = await sb.auth.getSession();
afficher(session);

async function afficher(session){
  const connecte = !!session;
  $('connexion').hidden = connecte;
  $('app').hidden = !connecte;
  if(connecte){ $('etat').textContent = 'Connecté en tant que ' + session.user.email; await charger(); }
}

/* ---------- données ---------- */
async function charger(){
  const { data, error } = await sb.from('mouvements').select('*').order('jour',{ascending:false});
  if(error){
    $('rErr').textContent = "Lecture impossible : " + error.message +
      ". Si le message parle de permissions, vérifiez que votre adresse figure bien dans la règle d'accès en base.";
    return;
  }
  $('rErr').textContent='';
  journal = data || [];
  rendre();
}

async function ajouter(ligne){
  const { error } = await sb.from('mouvements').insert(ligne);
  if(error){ $('rErr').textContent = "Enregistrement impossible : " + error.message; return false; }
  $('rErr').textContent=''; await charger(); return true;
}

async function supprimer(id){
  const { error } = await sb.from('mouvements').delete().eq('id', id);
  if(error){ $('rErr').textContent = "Suppression impossible : " + error.message; return; }
  await charger();
}

/* ---------- rendu ---------- */
function rendre(){
  const s = solde();
  const v=$('val');
  v.textContent = eur(Math.abs(s));
  v.className = 'val ' + (s>0.004?'pos':s<-0.004?'neg':'');
  $('exp').textContent = s>0.004 ? "Avances non encore consommées : c'est notre crédit restant de gardes."
    : s<-0.004 ? "Gardes non couvertes par les avances : nous devons ce montant."
    : "Tout est à jour, aucune avance en cours ni garde à payer.";

  const l=$('liste'); l.innerHTML='';
  if(!journal.length){
    l.innerHTML = '<li class="vide">Rien d\'enregistré. Commencez par noter une avance ou une garde.</li>';
    return;
  }
  journal.forEach(e=>{
    const li=document.createElement('li');
    const g=document.createElement('div');
    g.innerHTML = `<div class="quoi">${e.type==='avance'?'Avance versée':'Garde'}</div>
      <div class="quand">${dateFr(e.jour)}${e.type==='garde'?` · ${e.debut}–${e.fin} · ${heuresFr(Number(e.heures))}`:''}</div>`;
    const sup=document.createElement('button');
    sup.className='sup'; sup.textContent='Supprimer';
    sup.onclick=()=>supprimer(e.id);
    g.appendChild(sup);
    const m=document.createElement('div');
    m.className='montant '+(e.type==='avance'?'pos':'neg');
    m.textContent=(e.type==='avance'?'+':'−')+' '+eur(Number(e.montant));
    li.append(g,m); l.appendChild(li);
  });
}

/* ---------- formulaires ---------- */
function ouvrir(f){
  const autre = f==='fAvance'?'fGarde':'fAvance';
  $(autre).hidden=true; $(f).hidden=false;
  if(f==='fAvance'){ $('aDate').value ||= aujourdhui(); $('aErr').textContent=''; }
  else { $('gDate').value ||= aujourdhui(); $('gErr').textContent=''; estimer(); }
}
$('bAvance').onclick=()=>ouvrir('fAvance');
$('bGarde').onclick=()=>ouvrir('fGarde');
document.querySelectorAll('[data-close]').forEach(b=> b.onclick=()=> $(b.dataset.close).hidden=true);

/* remplit les menus déroulants */
(function remplirSelects(){
  const opt = (v,t) => `<option value="${v}">${t}</option>`;
  let heures = opt('','--'), minutes = opt('','--');
  for(let h=0; h<24; h++) heures += opt(String(h).padStart(2,'0'), String(h).padStart(2,'0')+' h');
  for(let m=0; m<60; m+=5) minutes += opt(String(m).padStart(2,'0'), String(m).padStart(2,'0'));
  ['gDebH','gFinH'].forEach(id => $(id).innerHTML = heures);
  ['gDebM','gFinM'].forEach(id => $(id).innerHTML = minutes);
})();

const lire = (idH,idM) => {
  const h=$(idH).value, m=$(idM).value;
  return (h && m) ? h+':'+m : '';
};

function estimer(){
  const d=lire('gDebH','gDebM'), f=lire('gFinH','gFinM');
  if(!d||!f){ $('gEstim').textContent='Renseignez les horaires pour voir le montant.'; return; }
  const h=duree(d,f);
  $('gEstim').innerHTML=`${heuresFr(h)} de garde, soit <b>${eur(cout(h))}</b>.`;
}
['gDebH','gDebM','gFinH','gFinM'].forEach(id => $(id).onchange = estimer);

$('aOk').onclick=async()=>{
  const d=$('aDate').value, m=parseFloat($('aMontant').value);
  if(!d){ $('aErr').textContent='Choisissez une date.'; return; }
  if(!(m>0)){ $('aErr').textContent='Saisissez un montant supérieur à 0.'; return; }
  $('aOk').disabled=true;
  const ok = await ajouter({type:'avance', jour:d, montant:m});
  $('aOk').disabled=false;
  if(ok){ $('aMontant').value=''; $('fAvance').hidden=true; }
};

$('gOk').onclick=async()=>{
  const d=$('gDate').value, deb=lire('gDebH','gDebM'), fin=lire('gFinH','gFinM');
  if(!d){ $('gErr').textContent='Choisissez une date.'; return; }
  if(!deb||!fin){ $('gErr').textContent="Renseignez l'heure de début et de fin."; return; }
  const h=duree(deb,fin);
  $('gOk').disabled=true;
  const ok = await ajouter({type:'garde', jour:d, debut:deb, fin, heures:h.toFixed(4), montant:cout(h).toFixed(2)});
  $('gOk').disabled=false;
  if(ok){ ['gDebH','gDebM','gFinH','gFinM'].forEach(id=>$(id).value=''); $('fGarde').hidden=true; }
};

$('bRefresh').onclick = charger;

$('bExport').onclick=()=>{
  if(!journal.length){ $('rErr').textContent="Rien à exporter pour l'instant."; return; }
  $('rErr').textContent='';
  const lignes=[['Date','Type','Debut','Fin','Heures','Montant EUR']];
  [...journal].sort((a,b)=>a.jour.localeCompare(b.jour)).forEach(e=>{
    lignes.push([e.jour, e.type==='avance'?'Avance':'Garde', e.debut||'', e.fin||'',
      e.type==='garde'? Number(e.heures).toFixed(2).replace('.',','):'',
      (e.type==='avance'? Number(e.montant) : -Number(e.montant)).toFixed(2).replace('.',',')]);
  });
  lignes.push(['Solde','','','','',solde().toFixed(2).replace('.',',')]);
  $('csv').value = lignes.map(l=>l.join(';')).join('\n');
  $('fExport').hidden=false;
  $('csv').scrollIntoView({block:'center',behavior:'smooth'});
};

$('bCopier').onclick=async()=>{
  const t=$('csv');
  try{
    await navigator.clipboard.writeText(t.value);
    $('bCopier').textContent='Copié';
    setTimeout(()=>$('bCopier').textContent='Copier',2000);
  }catch(e){
    t.focus(); t.setSelectionRange(0,t.value.length);
    $('rErr').textContent="Copie automatique refusée par le navigateur. Le texte est sélectionné, utilisez Copier du menu de votre téléphone.";
  }
};
</script>
</body>
</html>
